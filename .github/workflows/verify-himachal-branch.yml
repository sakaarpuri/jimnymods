name: Verify Himachal challenge branch
on:
  push:
    branches: [codex/himachal-precision-drives]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Refresh the tracked game bundle
        run: |
          if ! git diff --quiet -- assets/trail-game.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/trail-game.js
            git commit -m "Refresh bundled Himachal driving game" -- assets/trail-game.js
            git push origin HEAD:refs/heads/codex/himachal-precision-drives
          fi
      - run: node --test tests/himachal-challenges.test.mjs tests/trail-adventure.test.mjs tests/himachal-mountain.test.mjs
      - if: always() && !cancelled()
        run: node scripts/himachal-challenge-runs.mjs
